[package]
name = "web-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
# The asynchronous runtime (mandatory for fast crawling)
tokio = { version = "1.35", features = ["full"] }

# The HTTP client to make the requests
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# HTML parsing and DOM manipulation
scraper = "0.18"

# URL parsing and normalization (handling relative links)
url = "2.5"

# Image base64 encoding for storing inline image data
base64 = "0.21"

# Connecting to Redis (for our URL Frontier/Queue)
redis = { version = "0.24", features = ["tokio-comp"] }

# Connecting to PostgreSQL (for our Document Store)
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid"] }

# Error handling
anyhow = "1.0"
dotenvy = "0.15.7"
