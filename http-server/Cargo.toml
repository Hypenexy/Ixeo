[package]
name = "http-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
chrono = { version = "0.4.41", features = ["serde"] }
dotenvy = "0.15.7"
http = "1.0"
reqwest = { version = "0.12.13", features = ["json", "rustls-tls"] }
scraper = "0.22.0"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "chrono"] }
tantivy = "0.26.1"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
url = "2.5.4"
